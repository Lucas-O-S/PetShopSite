<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Pet</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>

    <header>
        <img class="icon" src="./assets/svg/dog-duotone.svg" alt="dog" srcset="">
        <h2>Mundo Pet</h2>
    </header>

    <main>
        <div id="scheduleContainer">

            <section id="scheduleHeader">
                <div id="scheduleTitle">
                    <h1>Sua agenda</h1>
                    <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
                </div>

                <div id="scheduleDate" class="customInput">
                    <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                    <input type="date" name="scheduleDate" id="scheduleDateInput"/>
                </div>
            </section>
    
            <section id="scheduleMaster">
    
                <section id="ScheduleMorning" class="scheduleCard">
        
                    <div class="scheduleCard-content">
    
                        <section class="scheduleCard-header">
                           
                            <div class="scheduleCard-header-title">
                                <img class="icon" src="./assets/svg/Sun-Fog--Streamline-Solar.svg" alt="calendario" srcset="">
                                <h3>Manhã</h3>
                            </div>
    
                            <div class="scheduleCard-header-period">09h-12h</div>
    
                        </section>
    
                        <table>
                              <colgroup>
                                    <col>
                                    <col>
                                    <col>
                                    <col>
                                </colgroup>
                            <tbody>
  
                            </tbody>
                        </table>
    
                    </div>
        
                </section>


    
                <section  id="ScheduleAfternoon"class="scheduleCard">
        
                    <div class="scheduleCard-content">
    
                        <section class="scheduleCard-header">
                           
                            <div class="scheduleCard-header-title">
                                <img class="icon" src="./assets/svg/Cloud-Sun-4--Streamline-Solar.svg" alt="calendario" srcset="">
                                <h3>Tarde</h3>
                            </div>
    
                            <div class="scheduleCard-header-period">13h-18h</div>
    
                        </section>
    
                        <table>
                              <colgroup>
                                    <col>
                                    <col>
                                    <col>
                                    <col>
                                </colgroup>
                            <tbody>
                            </tbody>
                        </table>
    
                    </div>
        
    
                </section>

                
                <section  id="ScheduleNight" class="scheduleCard">
        
                    <div class="scheduleCard-content">
    
                        <section class="scheduleCard-header">
                           
                            <div class="scheduleCard-header-title">
                                <img class="icon" src="./assets/svg/Moon Stars.svg" alt="calendario" srcset="">
                                <h3>Manhã</h3>
                            </div>
    
                            <div class="scheduleCard-header-period">19h-21h</div>
    
                        </section>
    
                        <table>
                              <colgroup>
                                    <col>
                                    <col>
                                    <col>
                                    <col>
                                </colgroup>
                            <tbody>

                            </tbody>
                        </table>
    
                    </div>

                </section>


        </div>
    
         
    </main>

    <div id="newScheduleButton">
        <button><h2>Novo Agendamento</h2></button>
    </div>
    
</body>
</html>
