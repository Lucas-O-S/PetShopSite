<template id="schedule-modal">
 
   <div class="scheduleModal-container">
   
   <div class="scheduleModal-header">
      
      <h1>Agende um atendimento</h1>
      <p>Preencha os dados do cliente para realizar o agendamento:</p>


      <form id="newScheduleForm">

         <div class="fieldArea"">

            <div class="fieldArea-item">
               <label for="TutorName">Nome do tutor</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                  <input type="text" id="TutorName" name="TutorName" required />
               </div>
            </div>

            <div class="fieldArea-item">
               <label for="PetName">Nome do Pet</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                  <input type="text" id="PetName" name="PetName" required />
               </div>
            </div>

            <div class="fieldArea-item">
               <label for="Telefone">Telefone</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                  <input type="text" id="Telefone" name="Telefone" required />
               </div>
            </div>

            <div class="fieldArea-item">
               <label for="Service">Descrição de Serviço</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                  <input type="text" id="Service" name="Service" required />
               </div>
            </div>

            <div class="fieldRow">

               <div class="fieldArea-item">
                  <label for="Date">Data</label>
                  <div class="customInput">
                     <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                     <input type="date" id="Date" name="Date" required />
                  </div>
               </div>
   
               <div class="fieldArea-item">
                  <label for="Hour">Hora</label>
                  <div class="customInput">
                     <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                     <input type="Text" id="Hour" name="Hour" required />
                  </div>
               </div>
   
               
            </div>

         
      </form>

   </div>
 
</div>

</template>
