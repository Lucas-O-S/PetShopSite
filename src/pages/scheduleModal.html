<template id="schedule-modal">
 
   <div class="scheduleModal-container">
     
      <img id="modalExit" class="icon" src="./assets/svg/Vector.svg" alt="exit" srcset="">

      <div class="scheduleModal-header">
         
         <h1>Agende um atendimento</h1>
         <p>Preencha os dados do cliente para realizar o agendamento:</p>
         
      </div>


      <form id="newScheduleForm">

         <div class="fieldArea">

            <div class="fieldArea-item">
               <label for="TutorName">Nome do tutor</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/User.svg" alt="calendario" srcset="">
                  <input type="text" id="TutorName" name="TutorName" placeholder="Digite o nome do dono" required  />
               </div>
            </div>

            <div class="fieldArea-item">
               <label for="PetName">Nome do Pet</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/pet-paw--paw-foot-animals-pets-footprint-track-hotel.svg" alt="calendario" srcset="">
                  <input type="text" id="PetName" name="PetName" placeholder="Digite o nome do pet" required />
               </div>
            </div>

            <div class="fieldArea-item">
               <label for="Telefone">Telefone</label>
               <div class="customInput">
                  <img class="icon" src="./assets/svg/Phone.svg" alt="calendario" srcset="">
                  <input type="text" class="telephone" id="Telefone" name="Telefone" placeholder="(11) 11111-1111" required />
               </div>
            </div>

            <div class="fieldArea-item">
               <label for="Service">Descrição de Serviço</label>
               <div class="customInput">
                  <textarea type="textarea" id="Service" name="Service" placeholder="Digite o serviço" required> </textarea>
               </div>
            </div>

            <div class="fieldRow">

               <div class="fieldArea-item">
                  <label for="Date">Data</label>
                  <div class="customInput">
                     <img class="icon" src="./assets/svg/Calendar-Minimalistic--Streamline-Solar.svg" alt="calendario" srcset="">
                     <input type="date" id="Date" name="Date" required />
                  </div>
               </div>

               <div class="fieldArea-item">
                  <label for="Hour">Hora</label>
                  <div class="customInput">
                     <img class="icon" src="./assets/svg/Clock-Circle--Streamline-Solar.svg" alt="calendario" srcset="">
                     <select type="Text" id="Hour" name="Hour" required >
                          <option value="">Selecione um horário</option>

                              <option value="09:00">09:00</option>
                              <option value="09:30">09:30</option>
                              <option value="10:00">10:00</option>
                              <option value="10:30">10:30</option>
                              <option value="11:00">11:00</option>
                              <option value="11:30">11:30</option>
                              <option value="12:00">12:00</option>
                              <option value="12:30">12:30</option>
                              <option value="13:00">13:00</option>
                              <option value="13:30">13:30</option>
                              <option value="14:00">14:00</option>
                              <option value="14:30">14:30</option>
                              <option value="15:00">15:00</option>
                              <option value="15:30">15:30</option>
                              <option value="16:00">16:00</option>
                              <option value="16:30">16:30</option>
                              <option value="17:00">17:00</option>
                              <option value="17:30">17:30</option>
                              <option value="18:00">18:00</option>
                              <option value="18:30">18:30</option>
                              <option value="19:00">19:00</option>
                              <option value="19:30">19:30</option>
                              <option value="20:00">20:00</option>
                              <option value="20:30">20:30</option>
                              <option value="21:00">21:00</option>

                     </select>
                  </div>
               </div>

               
            </div>
         

            
            <button type="submit" id="sendButton">Agendar</button>
         </div>
      </form>

 
   </div>

</template>
